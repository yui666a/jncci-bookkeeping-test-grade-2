# https://lefthook.dev/configuration/

pre-push:
  # 並列にしない。保護ブランチへのpushで止まるときに、20秒前後かかる
  # 検査の終わりを待たせない。
  piped: true
  jobs:
    # runではなくscriptで実行する。runはlefthookがpush対象ファイルを数え、
    # 空なら "no matching push files" でジョブごと飛ばす。空コミットや
    # 差分のないマージがmainに入ってしまうため、その打ち切りを受けない
    # script形式を使う。
    #
    # use_stdinがないと、gitがpush先のrefを渡す標準入力をスクリプトが
    # 受け取れず、判定材料がないまま常に素通りする。
    - script: "block-protected-push.sh"
      runner: sh
      use_stdin: true
    # CIだけに任せない。落ちるものをpushしてからCIで気づくと、直しの
    # コミットがPRに積もる。
    - run: npm run check
    - run: npm test
    - run: npm run coverage
