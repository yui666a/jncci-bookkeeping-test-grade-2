name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# main への push は進行中のデプロイを中断しない。公開済みの版が中途半端な
# 状態で置き換わるより、古い版が数分残るほうが害が小さい。
#
# PRごとには別のグループを与える。共通のグループにすると、同時に開いた
# PRの検査が互いを待つか打ち切る。PRの検査は配信を伴わないので、
# 新しい push で古い検査を打ち切ってよい。
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 機械的な品質ゲート
        run: pnpm run check
      - name: 単体テスト
        run: pnpm test
      - name: 論点カバレッジ
        run: pnpm run coverage

  deploy:
    needs: check
    # PRでは配信しない。レビュー前の内容が公開サイトに出てしまう。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
